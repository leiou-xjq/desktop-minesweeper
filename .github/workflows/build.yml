name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DesktopMinesweeper/DesktopMinesweeper.csproj

      - name: Build
        run: dotnet build src/DesktopMinesweeper/DesktopMinesweeper.csproj -c Release --no-restore

      - name: Rules self-test
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'dms-selftest.txt'
          dotnet run --project src/DesktopMinesweeper/DesktopMinesweeper.csproj -c Release --no-build -- --selftest $report
          $code = $LASTEXITCODE
          Get-Content $report -Encoding UTF8
          if ($code -ne 0) { exit $code }

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $value = $env:GITHUB_REF.Substring('refs/tags/v'.Length)
          }
          else {
            [xml]$project = Get-Content 'src/DesktopMinesweeper/DesktopMinesweeper.csproj'
            $value = [string](@($project.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1)
          }
          "value=$value" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: .\publish.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Verify published exe
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/win-x64/DesktopMinesweeper.exe'
          $report = Join-Path $env:RUNNER_TEMP 'dms-published-selftest.txt'
          $process = Start-Process -FilePath $exe -ArgumentList @('--selftest', $report) -Wait -PassThru
          Get-Content $report -Encoding UTF8
          if ($process.ExitCode -ne 0) { throw "published self-test failed with exit code $($process.ExitCode)" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: .\installer\build-installer.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter '*-setup.exe'
          if (-not $setup) { throw 'Installer was not produced.' }
          Get-ChildItem dist -Filter '*-setup.exe*' | Select-Object Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-minesweeper-win-x64
          path: dist/**

      - name: Attach release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          generate_release_notes: true
